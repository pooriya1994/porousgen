name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit, regression and exact-porosity tests
        run: python -m pytest -q
      - name: CLI smoke test (lower-case console script)
        shell: bash
        run: |
          porousgen --version
          porousgen list
          porousgen foam --resolution 32 --porosity 0.9 --cells 3 --metrics --out ci_foam
          porousgen analyze ci_foam.dat --size 0.01
          python -m porousgen.cli gyroid --resolution 24 --cells 2 --no-stl --out ci_gyroid
